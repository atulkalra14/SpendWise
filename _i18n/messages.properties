# Runtime messages (default language: en), used by req.error / req.reject.
# Keys start with their context. The key is also returned as `error.code` to clients.
# Placeholders are positional ({0}, {1}) and are filled from the `args` of the request error.

# --- Registration (srv/registration-service.js) ---
REGISTRATION_DISPLAYNAME_INVALID=Enter a display name of 1 to 100 characters.
REGISTRATION_EMAIL_INVALID=Enter a valid email address.
REGISTRATION_PASSWORD_LENGTH=The password must be {0} to {1} characters long.
REGISTRATION_TERMS_REQUIRED=You must accept the terms to create an account.
REGISTRATION_FAILED=Registration failed. Use a different email or sign in.

# --- Expenses (srv/expense-service.js) ---
EXPENSE_CATEGORY_NOT_FOUND=The category does not exist.
EXPENSE_SUBCATEGORY_NOT_FOUND=The subcategory does not exist.
EXPENSE_SUBCATEGORY_REQUIRES_CATEGORY=A subcategory needs a category.
EXPENSE_SUBCATEGORY_CATEGORY_MISMATCH=The subcategory does not belong to the category.
EXPENSE_MONTH_FORMAT=Enter the month as YYYY-MM.
EXPENSE_CURRENCY_UNSUPPORTED=Totals for currencies other than EUR are not supported yet.

# --- User profile (srv/user-service.js) ---
USER_PROFILE_CREATE_FORBIDDEN=Profiles cannot be created.
USER_CURRENCY_UNSUPPORTED=Only EUR is supported as default currency for now.
USER_PASSWORD_LENGTH=The password must be {0} to {1} characters long.
