#XTIT: Feature card title
featureIncomeTitle=Income and expenses
#XTXT: Feature card text
featureIncomeText=Log every transaction in seconds and see exactly where your money goes.
#XTXT: Feature dialog intro
featureIncomeIntro=Record what comes in and what goes out, so you always know where your money went.
#XTXT: Feature dialog point
featureIncomePoint1=Add each transaction with an amount, date, category and an optional note.
#XTXT: Feature dialog point
featureIncomePoint2=Amounts are stored and calculated as exact decimal values in euros, so totals always add up to the cent.
#XTXT: Feature dialog point
featureIncomePoint3=Review your transactions by month and see a summary of income, expenses and what is left.
#XTXT: Feature dialog point
featureIncomePoint4=Edit or delete an entry at any time. Your history stays under your control.
#XTXT: Feature dialog note
featureIncomeNote=Amounts are entered by you. SpendWise does not connect to your bank and never moves money.

#XTIT: Feature card title
featureBudgetsTitle=Budgets that nudge
#XTXT: Feature card text
featureBudgetsText=Set limits per category and get a warning before you overspend.
#XTXT: Feature dialog intro
featureBudgetsIntro=Set a monthly limit for the categories that matter to you and keep spending on track.
#XTXT: Feature dialog point
featureBudgetsPoint1=Choose a monthly limit for each category, such as groceries, dining or transport.
#XTXT: Feature dialog point
featureBudgetsPoint2=A progress bar shows how much of each limit you have used so far this month.
#XTXT: Feature dialog point
featureBudgetsPoint3=You get a warning when a category reaches 90% of its limit, before you go over it.
#XTXT: Feature dialog point
featureBudgetsPoint4=Budgets are planning tools. They never block a transaction.
#XTXT: Feature dialog note
featureBudgetsNote=Budgets are not available yet. This describes how the feature is planned to work.

#XTIT: Feature card title
featureSavingsTitle=Savings you can see
#XTXT: Feature card text
featureSavingsText=Income minus expenses, calculated for you, plus a way to set money aside on purpose.
#XTXT: Feature dialog intro
featureSavingsIntro=See how much you keep each month, and set money aside deliberately.
#XTXT: Feature dialog point
featureSavingsPoint1=Savings are calculated for you as income minus expenses. You never enter them by hand.
#XTXT: Feature dialog point
featureSavingsPoint2=Your savings rate shows what share of your income you kept.
#XTXT: Feature dialog point
featureSavingsPoint3=A separate "transfer to savings" entry lets you record money you set aside on purpose.
#XTXT: Feature dialog point
featureSavingsPoint4=Everything is calculated in your account currency, using exact decimal math.
#XTXT: Feature dialog note
featureSavingsNote=SpendWise shows your own numbers. It does not give financial, investment or tax advice.

#XTIT: Feature card title
featurePricesTitle=Product price history
#XTXT: Feature card text
featurePricesText=Follow what the things you buy regularly cost over time.
#XTXT: Feature dialog intro
featurePricesIntro=Track the prices of products you buy often and notice when they change.
#XTXT: Feature dialog point
featurePricesPoint1=Link a purchase to a product, such as a brand of coffee or a monthly transport pass.
#XTXT: Feature dialog point
featurePricesPoint2=See a price history over time, with the lowest and highest price you paid.
#XTXT: Feature dialog point
featurePricesPoint3=Spot price increases early and compare what you paid at different stores.
#XTXT: Feature dialog point
featurePricesPoint4=Price drop alerts are optional and can be switched off in your profile.
#XTXT: Feature dialog note
featurePricesNote=Prices come from the purchases you log yourself. SpendWise does not collect prices from other websites.

#XTIT: Feature card title
featureRecurringTitle=Recurring payments
#XTXT: Feature card text
featureRecurringText=Keep subscriptions and bills in one place so nothing surprises you.
#XTXT: Feature dialog intro
featureRecurringIntro=Keep your subscriptions, rent and bills in one list so nothing catches you off guard.
#XTXT: Feature dialog point
featureRecurringPoint1=Add a payment once and set how often it repeats: weekly, monthly or yearly.
#XTXT: Feature dialog point
featureRecurringPoint2=See your total fixed costs per month and the next due date for each payment.
#XTXT: Feature dialog point
featureRecurringPoint3=Optional reminders arrive two days before a payment is due.
#XTXT: Feature dialog point
featureRecurringPoint4=Pause or end a recurring payment whenever you cancel it.
#XTXT: Feature dialog note
featureRecurringNote=SpendWise only records and reminds. It never pays a bill or cancels a subscription for you.

#XTIT: Feature card title
featurePrivacyTitle=Private by design
#XTXT: Feature card text
featurePrivacyText=Your data is isolated to your account. Only you can see it.
#XTXT: Feature dialog intro
featurePrivacyIntro=Your financial data belongs to you. SpendWise is built so that only you can see it.
#XTXT: Feature dialog point
featurePrivacyPoint1=Every record is tied to your account, and the server only returns your own data.
#XTXT: Feature dialog point
featurePrivacyPoint2=Passwords are never stored as plain text. Only a salted hash is kept, and it is never sent to the app.
#XTXT: Feature dialog point
featurePrivacyPoint3=We do not sell your data or use it for advertising.
#XTXT: Feature dialog point
featurePrivacyPoint4=Our Privacy Policy explains what we collect and the rights you have over it.
#XTXT: Feature dialog note
featurePrivacyNote=Read the Terms of Service and Privacy Policy linked in the footer for the full details.

