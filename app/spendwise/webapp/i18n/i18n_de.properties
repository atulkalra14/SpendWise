featureStatusSoon=Demnächst

featureIncomeTitle=Einnahmen und Ausgaben
featureIncomeText=Erfassen Sie jede Transaktion in Sekunden und sehen Sie genau, wohin Ihr Geld fließt.
featureIncomeIntro=Halten Sie fest, was hereinkommt und was ausgeht, damit Sie immer wissen, wohin Ihr Geld geflossen ist.
featureIncomePoint1=Fügen Sie jede Transaktion mit Betrag, Datum, Kategorie und einer optionalen Notiz hinzu.
featureIncomePoint2=Beträge werden als exakte Dezimalwerte in Euro gespeichert und berechnet, damit Summen immer auf den Cent genau stimmen.
featureIncomePoint3=Prüfen Sie Ihre Transaktionen nach Monat und sehen Sie eine Übersicht über Einnahmen, Ausgaben und den Rest.
featureIncomePoint4=Bearbeiten oder löschen Sie einen Eintrag jederzeit. Ihr Verlauf bleibt unter Ihrer Kontrolle.
featureIncomeNote=Die Beträge geben Sie selbst ein. SpendWise verbindet sich nicht mit Ihrer Bank und bewegt nie Geld.

featureBudgetsTitle=Budgets mit Frühwarnung
featureBudgetsText=Legen Sie Limits pro Kategorie fest und erhalten Sie eine Warnung, bevor Sie zu viel ausgeben.
featureBudgetsIntro=Legen Sie ein Monatslimit für die Kategorien fest, die Ihnen wichtig sind, und behalten Sie Ihre Ausgaben im Griff.
featureBudgetsPoint1=Wählen Sie für jede Kategorie ein Monatslimit, zum Beispiel für Lebensmittel, Restaurants oder Verkehr.
featureBudgetsPoint2=Ein Fortschrittsbalken zeigt, wie viel von jedem Limit Sie in diesem Monat bereits genutzt haben.
featureBudgetsPoint3=Sie erhalten eine Warnung, wenn eine Kategorie 90 % ihres Limits erreicht, bevor Sie es überschreiten.
featureBudgetsPoint4=Budgets sind Planungswerkzeuge. Sie blockieren nie eine Transaktion.
featureBudgetsNote=Budgets sind noch nicht verfügbar. Dies beschreibt, wie die Funktion geplant ist.

featureSavingsTitle=Ersparnisse auf einen Blick
featureSavingsText=Einnahmen minus Ausgaben, für Sie berechnet, plus die Möglichkeit, gezielt Geld zur Seite zu legen.
featureSavingsIntro=Sehen Sie, wie viel Sie jeden Monat behalten, und legen Sie gezielt Geld zur Seite.
featureSavingsPoint1=Ersparnisse werden für Sie als Einnahmen minus Ausgaben berechnet. Sie müssen sie nie von Hand eingeben.
featureSavingsPoint2=Ihre Sparquote zeigt, welchen Anteil Ihrer Einnahmen Sie behalten haben.
featureSavingsPoint3=Mit einem separaten Eintrag „Übertrag auf Sparen“ halten Sie Geld fest, das Sie bewusst zur Seite legen.
featureSavingsPoint4=Alles wird in Ihrer Kontowährung mit exakter Dezimalrechnung berechnet.
featureSavingsNote=SpendWise zeigt Ihre eigenen Zahlen. Es bietet keine Finanz-, Anlage- oder Steuerberatung.

featurePricesTitle=Preisverlauf für Produkte
featurePricesText=Verfolgen Sie, was die Dinge, die Sie regelmäßig kaufen, im Zeitverlauf kosten.
featurePricesIntro=Verfolgen Sie die Preise von Produkten, die Sie oft kaufen, und bemerken Sie, wenn sie sich ändern.
featurePricesPoint1=Verknüpfen Sie einen Einkauf mit einem Produkt, zum Beispiel einer Kaffeemarke oder einer monatlichen Fahrkarte.
featurePricesPoint2=Sehen Sie einen Preisverlauf mit dem niedrigsten und dem höchsten Preis, den Sie gezahlt haben.
featurePricesPoint3=Erkennen Sie Preiserhöhungen frühzeitig und vergleichen Sie, was Sie in verschiedenen Geschäften gezahlt haben.
featurePricesPoint4=Benachrichtigungen bei Preissenkungen sind optional und lassen sich in Ihrem Profil ausschalten.
featurePricesNote=Die Preise stammen aus den Einkäufen, die Sie selbst erfassen. SpendWise sammelt keine Preise von anderen Websites.

featureRecurringTitle=Wiederkehrende Zahlungen
featureRecurringText=Behalten Sie Abos und Rechnungen an einem Ort, damit Sie nichts überrascht.
featureRecurringIntro=Führen Sie Ihre Abos, die Miete und Rechnungen in einer Liste, damit Sie nichts unvorbereitet trifft.
featureRecurringPoint1=Legen Sie eine Zahlung einmal an und bestimmen Sie, wie oft sie sich wiederholt: wöchentlich, monatlich oder jährlich.
featureRecurringPoint2=Sehen Sie Ihre Fixkosten pro Monat und das nächste Fälligkeitsdatum jeder Zahlung.
featureRecurringPoint3=Optionale Erinnerungen kommen zwei Tage vor der Fälligkeit einer Zahlung.
featureRecurringPoint4=Pausieren oder beenden Sie eine wiederkehrende Zahlung, sobald Sie sie kündigen.
featureRecurringNote=SpendWise erfasst und erinnert nur. Es bezahlt nie eine Rechnung und kündigt kein Abo für Sie.

featurePrivacyTitle=Datenschutz von Grund auf
featurePrivacyText=Ihre Daten sind auf Ihr Konto beschränkt. Nur Sie können sie sehen.
featurePrivacyIntro=Ihre Finanzdaten gehören Ihnen. SpendWise ist so gebaut, dass nur Sie sie sehen können.
featurePrivacyPoint1=Jeder Datensatz ist an Ihr Konto gebunden, und der Server liefert nur Ihre eigenen Daten zurück.
featurePrivacyPoint2=Passwörter werden nie im Klartext gespeichert. Nur ein gesalzener Hash wird abgelegt und nie an die App gesendet.
featurePrivacyPoint3=Wir verkaufen Ihre Daten nicht und nutzen sie nicht für Werbung.
featurePrivacyPoint4=Unsere Datenschutzerklärung erklärt, was wir erheben und welche Rechte Sie daran haben.
featurePrivacyNote=Lesen Sie die Nutzungsbedingungen und die Datenschutzerklärung im Fußbereich für alle Details.

